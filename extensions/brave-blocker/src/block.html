<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockedin Blocked</title>
    <link rel="stylesheet" href="./block.css" />
  </head>
  <body>
    <main class="shell">
      <div class="bubble bubble-large"></div>
      <div class="bubble bubble-small"></div>
      <section class="card">
        <span class="eyebrow">Blocked</span>
        <h1 id="title">Take a deep breath.</h1>
        <p>This page is blocked during your active focus session.</p>
        <div class="pill-row">
          <span class="pill" id="target-label">Distraction</span>
          <span class="pill">Return to your intended task</span>
        </div>
      </section>
    </main>
    <script src="./block.js" type="module"></script>
  </body>
  </html>
